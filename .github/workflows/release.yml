name: Release

# Builds a signed release APK + AAB and publishes them.
#
# Requires these repo secrets (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64   `base64 -i release.jks | pbcopy` output of your upload keystore
#   RELEASE_KEYSTORE_PASSWORD keystore password
#   RELEASE_KEY_ALIAS         key alias inside the keystore
#   RELEASE_KEY_PASSWORD      key password (often same as the keystore password)
#
# Without these secrets set, app/build.gradle.kts falls back to signing with the debug
# key, so this workflow would still succeed but must never be used to ship - it's
# there so PR/dispatch builds without secrets access can still be verified.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "What to build"
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # A tag push has no `inputs` context at all, so default to a release build there.
    # `secrets` can't be referenced directly in `if:` conditionals, so mirror it into env first.
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: env.BUILD_TYPE == 'release' && env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK and AAB
        if: env.BUILD_TYPE == 'release'
        env:
          POKEDEX_RELEASE_KEYSTORE_PATH: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          POKEDEX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          POKEDEX_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          POKEDEX_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Build debug APK
        if: env.BUILD_TYPE == 'debug'
        run: ./gradlew :app:assembleDebug

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload release APK artifact
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB artifact
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload debug APK artifact
        if: env.BUILD_TYPE == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Manual dispatch runs (either build_type) never cut a GitHub Release, even for a
      # release build - that only happens from a version tag, so you can sanity-check a
      # signed build before it's published anywhere.
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab